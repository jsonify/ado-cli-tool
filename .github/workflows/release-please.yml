name: Release Please

# On every push to main, release-please reads the commit messages since the last release and keeps a release PR
# open: the next version (fix: -> patch, feat: -> minor, a "!" or BREAKING CHANGE -> major; while below 1.0 a
# breaking change bumps the minor instead), CHANGELOG.md and version.txt. Merging that PR tags vX.Y.Z, creates the
# GitHub release, and runs release.yml to build and sign ADO Desk (Developer ID and notarised, or self-signed when
# those secrets aren't set) and attach it to the release.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with the workflow token doesn't start other workflows, so the release build is called from here.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
